name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Run quality checks
        shell: msys2 {0}
        run: ctest --test-dir build -R '^monosect-unit-tests$' --output-on-failure --verbose

      - name: Fetch and verify the pinned FFmpeg
        shell: pwsh
        run: ./tools/prepare-ffmpeg.ps1 -Destination ffmpeg

      - name: Run the end-to-end suite
        shell: msys2 {0}
        run: python tests/harness/end_to_end.py build/monosect-cli.exe e2e-work

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-log
          path: e2e-work/e2e.log
          if-no-files-found: ignore
