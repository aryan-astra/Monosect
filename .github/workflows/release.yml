name: Release Monosect

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate tag matches repository version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $versionFromTag = $tag.TrimStart('v')
          if (-not (Test-Path "version.txt")) {
            throw "version.txt not found"
          }
          $versionFromRepo = (Get-Content "version.txt" -Raw).Trim()
          if ($versionFromRepo -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "version.txt must contain MAJOR.MINOR.PATCH"
          }
          if ($versionFromTag -ne $versionFromRepo) {
            throw "Tag version ($versionFromTag) does not match repository version ($versionFromRepo)"
          }
          Write-Host "✓ Tag/version validation passed: $versionFromTag"

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONOSECT_STRICT_WARNINGS=ON

      - name: Build all release targets
        shell: msys2 {0}
        run: cmake --build build -j 4

      - name: Run unit tests
        shell: msys2 {0}
        run: ctest --test-dir build -E monosect-end-to-end --output-on-failure

      - name: Bundle and verify the pinned FFmpeg
        shell: pwsh
        run: ./tools/prepare-ffmpeg.ps1 -Destination release

      - name: Run the end-to-end suite
        shell: msys2 {0}
        run: python tests/harness/end_to_end.py build/monosect-cli.exe e2e-work

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-e2e-log
          path: e2e-work/e2e.log
          if-no-files-found: ignore

      - name: Prepare and smoke-test portable package
        id: prepare_assets
        shell: pwsh
        env:
          MONOSECT_RELEASE_SIGNING_KEY: ${{ secrets.MONOSECT_RELEASE_SIGNING_KEY }}
          MONOSECT_RELEASE_SIGNING_KEY_ID: ${{ secrets.MONOSECT_RELEASE_SIGNING_KEY_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/package-release.ps1 -BuildDirectory build -ToolsDirectory release -Destination release -OmitMediaTools
          $version = (Get-Content version.txt -Raw).Trim()
          $uploadFiles = @("release/Monosect-$version-portable.zip", 'release/SHA256SUMS.txt')
          if ($env:MONOSECT_RELEASE_SIGNING_KEY) {
            if (-not $env:MONOSECT_RELEASE_SIGNING_KEY_ID) { throw 'A signing key ID is required' }
            $privateKeyPath = Join-Path $env:RUNNER_TEMP 'monosect-signing.key'
            try {
              $env:MONOSECT_RELEASE_SIGNING_KEY | Set-Content -LiteralPath $privateKeyPath -Encoding ascii
              gpg --batch --import $privateKeyPath
              if ($LASTEXITCODE -ne 0) { throw 'Signing key import failed' }
              gpg --batch --yes --armor --detach-sign --local-user $env:MONOSECT_RELEASE_SIGNING_KEY_ID --output release/SHA256SUMS.txt.asc release/SHA256SUMS.txt
              if ($LASTEXITCODE -ne 0) { throw 'Checksum signature failed' }
              $uploadFiles += 'release/SHA256SUMS.txt.asc'
            } finally {
              if (Test-Path -LiteralPath $privateKeyPath) { Remove-Item -LiteralPath $privateKeyPath -Force }
            }
          }
          'files<<EOF' >> $env:GITHUB_OUTPUT
          $uploadFiles -join "`n" >> $env:GITHUB_OUTPUT
          'EOF' >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-package
          path: |
            release/Monosect-*-portable.zip
            release/SHA256SUMS.txt*
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ steps.prepare_assets.outputs.files }}
          body: |
            **Monosect ${{ github.ref_name }}**

            ### Installation
            Download the portable ZIP, extract it to a writable folder, and run `Monosect.exe`.
            The first launch needs internet access to download and verify FFmpeg from the pinned upstream build.

            ### Contents
            - `Monosect-<version>-portable.zip` — Application, compiler runtimes, resources, license notices and build manifest
            - `SHA256SUMS.txt` — Checksums for file integrity verification

            ### Verification
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            For documentation, source code, and issue tracking, visit [github.com/aryan-astra/Monosect](https://github.com/aryan-astra/Monosect).
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
