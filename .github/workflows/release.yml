name: Release Monosect

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --target Monosect

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "build/Monosect.exe" "release/Monosect.exe" -Force
          if (Test-Path "build/Monosect-icon-square.png") { Copy-Item "build/Monosect-icon-square.png" "release/Monosect-icon-square.png" -Force }
          if (Test-Path "build/Monosect-full-logo.png") { Copy-Item "build/Monosect-full-logo.png" "release/Monosect-full-logo.png" -Force }

      - name: Create GitHub release and upload EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Monosect.exe
            release/Monosect-icon-square.png
            release/Monosect-full-logo.png
          generate_release_notes: true
