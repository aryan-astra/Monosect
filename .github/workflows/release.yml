name: Release Monosect

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches repository version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $versionFromTag = $tag.TrimStart('v')
          if (-not (Test-Path "version.txt")) {
            throw "version.txt not found"
          }
          $versionFromRepo = (Get-Content "version.txt" -Raw).Trim()
          if ($versionFromRepo -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "version.txt must contain MAJOR.MINOR.PATCH"
          }
          if ($versionFromTag -ne $versionFromRepo) {
            throw "Tag version ($versionFromTag) does not match repository version ($versionFromRepo)"
          }
          Write-Host "✓ Tag/version validation passed: $versionFromTag"

      - name: Setup MSYS2 (MinGW64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Monosect
        shell: msys2 {0}
        run: cmake --build build --target Monosect -j 4

      - name: Run quality checks
        shell: msys2 {0}
        run: |
          if [ -f "build/MonosectQualityChecks" ]; then
            build/MonosectQualityChecks
          fi

      - name: Bundle FFmpeg binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading FFmpeg binaries..."
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # The same pinned release CMake builds against, and the same digests.
          #
          # This used to fetch `releases/download/latest/ffmpeg-master-latest-...`,
          # which is a moving target: two release builds of MonoSect would bundle
          # different FFmpeg builds, so a bug report against one could not be
          # reproduced against the other.  It also meant the digests compiled into
          # MonoSect (MONOSECT_FFMPEG_SHA256 and the two executable pins) described
          # a build that was never shipped - and the product verifies the tools next
          # to it, so a user who trusted that check would have had it fail on every
          # release.
          #
          # To move the pin, take the digest from the release asset itself and update
          # the three CMake variables together:
          #   gh api repos/BtbN/FFmpeg-Builds/releases/tags/<tag> \
          #     --jq '.assets[] | select(.name|test("win64-gpl\\.zip$")) | .digest'
          $ffmpegTag = "autobuild-2026-10-03-18-14"
          $ffmpegAsset = "ffmpeg-N-127142-g12b7b9891b-win64-gpl.zip"
          $ffmpegArchiveSha256 = "a885f564dee2b60f69ab866c6c89b96ae531fc2ee1f24ff8b5b1a6d29960a96b"
          $ffmpegExeSha256 = "6de576f371de489d091a59e2b6906c8e14611d85627869100ee6fc12cdc47e33"
          $ffprobeExeSha256 = "3844bf66836cb7668742bfd4cc29b9fc9a5eebcbd198e212938448d1373cb532"

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/$ffmpegTag/$ffmpegAsset"
          $zipPath = "ffmpeg_download.zip"
          $tmpDir = "ffmpeg_tmp"

          try {
            Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -ErrorAction Stop

            $actual = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
            if ($actual -ne $ffmpegArchiveSha256) {
              throw "FFmpeg archive digest mismatch: expected $ffmpegArchiveSha256, got $actual. The pin and the download must be updated together."
            }
            Write-Host "Archive digest verified: $actual"

            Expand-Archive -Path $zipPath -DestinationPath $tmpDir -Force

            $ffmpegBin = Get-ChildItem -Path $tmpDir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            $ffprobeBin = Get-ChildItem -Path $tmpDir -Recurse -Filter ffprobe.exe | Select-Object -First 1

            if ($null -eq $ffmpegBin -or $null -eq $ffprobeBin) {
              throw "Unable to locate ffmpeg.exe/ffprobe.exe in downloaded archive"
            }

            # The archive digest proves the archive.  These prove the two files that
            # actually ship, which is what MonoSect checks at runtime - and which is
            # why one archive hash can never stand in for them.
            $actualFfmpeg = (Get-FileHash -Algorithm SHA256 $ffmpegBin.FullName).Hash.ToLowerInvariant()
            if ($actualFfmpeg -ne $ffmpegExeSha256) {
              throw "ffmpeg.exe digest mismatch: expected $ffmpegExeSha256, got $actualFfmpeg"
            }
            $actualFfprobe = (Get-FileHash -Algorithm SHA256 $ffprobeBin.FullName).Hash.ToLowerInvariant()
            if ($actualFfprobe -ne $ffprobeExeSha256) {
              throw "ffprobe.exe digest mismatch: expected $ffprobeExeSha256, got $actualFfprobe"
            }
            Write-Host "ffmpeg.exe and ffprobe.exe digests verified"

            Copy-Item $ffmpegBin.FullName "release/ffmpeg.exe" -Force
            Copy-Item $ffprobeBin.FullName "release/ffprobe.exe" -Force
            Write-Host "FFmpeg binaries bundled from the pinned release $ffmpegTag"
          } finally {
            if (Test-Path $tmpDir) { Remove-Item -Recurse -Force $tmpDir }
            if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          }

      - name: Prepare release assets
        id: prepare_assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Preparing release assets..."
          
          if (-not (Test-Path "build/Monosect.exe")) {
            throw "Build artifact not found: build/Monosect.exe"
          }
          if (-not ((Test-Path "release/ffmpeg.exe") -and (Test-Path "release/ffprobe.exe"))) {
            throw "FFmpeg binaries not found in release directory"
          }
          
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exePath = "release/Monosect.exe"
          $portableZipPath = "release/Monosect-$version-portable.zip"
          
          Copy-Item "build/Monosect.exe" $exePath -Force
          
          # Create portable package with bundled FFmpeg
          $portableFiles = @($exePath, "release/ffmpeg.exe", "release/ffprobe.exe")
          if (Test-Path "Monosect-icon-square.png") { $portableFiles += "Monosect-icon-square.png" }
          if (Test-Path "Monosect-full-logo.png") { $portableFiles += "Monosect-full-logo.png" }
          
          Compress-Archive -Path $portableFiles -DestinationPath $portableZipPath -Force
          if (-not (Test-Path $portableZipPath)) {
            throw "Failed to create portable ZIP"
          }
          Write-Host "✓ Created portable package: $(Split-Path -Leaf $portableZipPath)"
          
          # Generate SHA256 checksums
          $checksumLines = @()
          $checksumTargets = @($exePath, $portableZipPath)
          
          foreach ($target in $checksumTargets) {
            if (Test-Path $target) {
              $sha = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
              $checksumLines += "$sha  $(Split-Path -Path $target -Leaf)"
            }
          }
          $checksumLines | Set-Content "release/SHA256SUMS.txt" -Encoding ascii
          Write-Host "✓ Generated SHA256SUMS.txt"
          
          # Prepare upload list
          $uploadFiles = @(
            $exePath,
            $portableZipPath,
            "release/SHA256SUMS.txt"
          )
          
          # GPG sign if credentials provided
          if ("${{ secrets.MONOSECT_RELEASE_SIGNING_KEY }}" -ne "") {
            Write-Host "Signing release with GPG..."
            $privateKeyPath = Join-Path $env:RUNNER_TEMP "release-signing.key"
            "${{ secrets.MONOSECT_RELEASE_SIGNING_KEY }}" | Set-Content $privateKeyPath -Encoding ascii
            
            gpg --batch --import $privateKeyPath 2>&1 | Out-Null
            Remove-Item $privateKeyPath -Force
            
            if ("${{ secrets.MONOSECT_RELEASE_SIGNING_KEY_ID }}" -eq "") {
              throw "MONOSECT_RELEASE_SIGNING_KEY_ID required when signing key is provided"
            }
            
            gpg --batch --yes --armor --detach-sign --local-user "${{ secrets.MONOSECT_RELEASE_SIGNING_KEY_ID }}" --output "release/Monosect.exe.asc" $exePath
            
            if (Test-Path "release/Monosect.exe.asc") {
              $uploadFiles += "release/Monosect.exe.asc"
              Write-Host "✓ GPG signature generated"
            }
          } else {
            Write-Host "⚠ No GPG credentials configured; skipping signature"
          }
          
          "files<<EOF" >> $env:GITHUB_OUTPUT
          ($uploadFiles | Sort-Object -Unique) -join "`n" >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prepare_assets.outputs.files }}
          body: |
            **Monosect ${{ github.ref_name }}**

            ### Installation
            **Recommended:** Download the portable ZIP, extract anywhere, and run `Monosect.exe`.

            ### Contents
            - `Monosect.exe` — Standalone executable
            - `Monosect-${{ github.ref_name }}-portable.zip` — Complete package (executable + bundled FFmpeg + resources)
            - `SHA256SUMS.txt` — Checksums for file integrity verification

            ### Verification
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```

            For documentation, source code, and issue tracking, visit [github.com/aryan-astra/Monosect](https://github.com/aryan-astra/Monosect).
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
